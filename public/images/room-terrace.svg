<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Terrace Cabin</title><desc id="desc">Premium demo illustration for Loleza Ridge Lodge.</desc>
<defs>
