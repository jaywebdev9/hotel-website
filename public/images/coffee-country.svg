<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Coffee country</title><desc id="desc">Premium demo illustration for Loleza Ridge Lodge.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17352b"/><stop offset="1" stop-color="#9b623e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dabb55" stop-opacity=".95"/><stop offset="1" stop-color="#fff1a8" stop-opacity=".45"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="1" fill="#fff" opacity=".08"/><circle cx="20" cy="25" r="1" fill="#fff" opacity=".06"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle cx="1220" cy="190" r="170" fill="#dabb55" opacity=".15" filter="url(#blur)"/>

<path d="M0 720 Q250 510 500 700 T1000 650 T1600 520 V1000 H0Z" fill="#244b37"/>
<path d="M0 800 Q300 600 560 790 T1120 720 T1600 620" fill="none" stroke="#dabb55" stroke-opacity=".55" stroke-width="14"/>
<g fill="#315d45"><circle cx="260" cy="560" r="70"/><circle cx="420" cy="500" r="85"/><circle cx="580" cy="590" r="75"/><circle cx="980" cy="500" r="95"/><circle cx="1180" cy="570" r="80"/><circle cx="1390" cy="450" r="105"/></g>
<g fill="#f0ead6" opacity=".65"><circle cx="250" cy="545" r="8"/><circle cx="420" cy="480" r="8"/><circle cx="580" cy="575" r="8"/><circle cx="980" cy="485" r="8"/><circle cx="1180" cy="555" r="8"/><circle cx="1390" cy="435" r="8"/></g>

<rect width="1600" height="1000" fill="url(#grain)"/>
<rect x="56" y="56" width="1488" height="888" rx="38" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>